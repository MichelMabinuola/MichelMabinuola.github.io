<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%NAME% — %ROLE%</title>
    <meta name="description" content="%TITLE_LINE%. A portfolio that runs inside a memory-limited cgroup." />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%NAME% — %ROLE%" />
    <meta property="og:description" content="%TITLE_LINE%. This page runs in a memory-limited cgroup: click reclaimed sections to refault them." />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--static-resume--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
